---
- name: Apply chatbot deployment manifest
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../k8s/chatbot-ui.yaml"

- name: Apply HPA manifest
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../k8s/hpa.yaml"

- name: Wait for chatbot deployment rollout
  kubernetes.core.k8s_rollout_info:
    api_version: apps/v1
    kind: Deployment
    name: chatbot
    namespace: default
  register: rollout
  until: rollout.status.ready_replicas == rollout.status.replicas
  retries: 12
  delay: 10

- name: Print deployment status
  debug:
    msg: "Chatbot deployment is live with {{ rollout.status.ready_replicas }} replicas"
