---
- name: Apply chatbot namespace
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../k8s/namespace.yaml"

- name: Apply chatbot deployment manifest
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace | default('chatbot-prod') }}"
    template: "{{ playbook_dir }}/../k8s/chatbot-deployment.yaml.j2"

- name: Apply chatbot service manifest
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace | default('chatbot-prod') }}"
    src: "{{ playbook_dir }}/../k8s/service.yaml"

- name: Apply chatbot ingress manifest
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace | default('chatbot-prod') }}"
    src: "{{ playbook_dir }}/../k8s/ingress.yaml"

- name: Apply chatbot pod disruption budget
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace | default('chatbot-prod') }}"
    src: "{{ playbook_dir }}/../k8s/pdb.yaml"

- name: Apply HPA manifest
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace | default('chatbot-prod') }}"
    src: "{{ playbook_dir }}/../k8s/hpa.yaml"

- name: Wait for chatbot deployment rollout
  ansible.builtin.command: kubectl rollout status deployment/chatbot -n {{ namespace | default('chatbot-prod') }} --timeout=120s
  register: rollout_result
  changed_when: false

- name: Print deployment status
  debug:
    msg: "{{ rollout_result.stdout }}"
