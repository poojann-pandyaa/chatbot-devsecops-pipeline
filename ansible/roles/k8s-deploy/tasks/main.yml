---
- name: Apply chatbot deployment manifest
  kubernetes.core.k8s:
    state: present
    namespace: default
    src: "{{ playbook_dir }}/../k8s/chatbot-ui.yaml"

- name: Apply HPA manifest
  kubernetes.core.k8s:
    state: present
    namespace: default
    src: "{{ playbook_dir }}/../k8s/hpa.yaml"

- name: Wait for chatbot deployment rollout
  shell: kubectl rollout status deployment/chatbot -n default --timeout=120s
  register: rollout_result
  changed_when: false

- name: Print deployment status
  debug:
    msg: "{{ rollout_result.stdout }}"
