---
- name: Create vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vault

- name: Create chatbot namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"

- name: Deploy HashiCorp Vault in dev mode
  kubernetes.core.k8s:
    state: present
    force: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vault
        namespace: vault
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: vault
        template:
          metadata:
            labels:
              app: vault
          spec:
            containers:
            - name: vault
              image: hashicorp/vault:1.17.6
              args: ["server", "-dev", "-dev-root-token-id=root"]
              ports:
              - containerPort: 8200
              env:
              - name: VAULT_DEV_ROOT_TOKEN_ID
                value: "{{ vault_root_token }}"
              - name: VAULT_DEV_LISTEN_ADDRESS
                value: "0.0.0.0:8200"
              - name: SKIP_SETCAP
                value: "true"
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false

- name: Expose Vault as ClusterIP service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: vault
        namespace: vault
      spec:
        selector:
          app: vault
        ports:
        - port: 8200
          targetPort: 8200
        type: ClusterIP

- name: Wait for Vault pod to be ready
  ansible.builtin.command: >-
    kubectl wait --for=condition=ready pod -l app=vault -n vault --timeout=180s
  changed_when: false

- name: Store API keys in Vault via kubectl exec
  ansible.builtin.command: >-\
    kubectl exec -n vault deployment/vault -- sh -c "
      export VAULT_TOKEN={{ vault_root_token }} &&
      export VAULT_ADDR=http://127.0.0.1:8200 &&
      vault kv put secret/chatbot GROQ_API_KEY={{ groq_api_key }} OPENAI_API_KEY={{ openai_api_key }} MISTRAL_API_KEY={{ mistral_api_key }} GROK_API_KEY={{ grok_api_key }}"

- name: Create llm-secrets K8s Secret from Vault values
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: llm-secrets
        namespace: "{{ k8s_namespace }}"
      type: Opaque
      stringData:
        GROQ_API_KEY: "{{ groq_api_key }}"
        OPENAI_API_KEY: "{{ openai_api_key }}"
        MISTRAL_API_KEY: "{{ mistral_api_key }}"
        GROK_API_KEY: "{{ grok_api_key }}"
