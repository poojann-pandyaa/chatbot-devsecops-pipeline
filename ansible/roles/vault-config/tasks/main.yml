---
- name: Create Vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vault
  ignore_errors: yes

- name: Create chatbot namespace for secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ namespace | default('chatbot-prod') }}"
  ignore_errors: yes

- name: Deploy Vault in dev mode
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vault
        namespace: vault
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: vault
        template:
          metadata:
            labels:
              app: vault
          spec:
            containers:
            - name: vault
              image: hashicorp/vault:latest
              args: ["server", "-dev", "-dev-root-token-id=root"]
              ports:
              - containerPort: 8200
              env:
              - name: VAULT_DEV_ROOT_TOKEN_ID
                value: "root"
              - name: VAULT_DEV_LISTEN_ADDRESS
                value: "0.0.0.0:8200"
              - name: SKIP_SETCAP
                value: "true"
              securityContext:
                capabilities:
                  drop:
                    - ALL
                allowPrivilegeEscalation: false
  ignore_errors: yes

- name: Expose Vault as ClusterIP service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: vault
        namespace: vault
      spec:
        selector:
          app: vault
        ports:
        - port: 8200
          targetPort: 8200
        type: ClusterIP
  ignore_errors: yes

- name: Wait for Vault pod to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: vault
    label_selectors:
      - app=vault
  register: vault_pod
  ignore_errors: yes

- name: Store OPENAI_API_KEY in Vault
  uri:
    url: "http://vault.vault.svc.cluster.local:8200/v1/secret/data/chatbot"
    method: POST
    headers:
      X-Vault-Token: "root"
      Content-Type: "application/json"
    body_format: json
    body:
      data:
        OPENAI_API_KEY: "{{ openai_api_key }}"
  delegate_to: localhost
  ignore_errors: yes

- name: Create chatbot-secrets K8s Secret from Vault value
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: chatbot-secrets
        namespace: "{{ namespace | default('chatbot-prod') }}"
      type: Opaque
      stringData:
        OPENAI_API_KEY: "{{ openai_api_key }}"
  ignore_errors: yes
