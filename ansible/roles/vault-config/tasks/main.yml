---
- name: Create vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vault
  ignore_errors: yes

- name: Create chatbot namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ namespace }}"
  ignore_errors: yes

- name: Deploy HashiCorp Vault in dev mode
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vault
        namespace: vault
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: vault
        template:
          metadata:
            labels:
              app: vault
          spec:
            containers:
            - name: vault
              image: hashicorp/vault:latest
              args: ["server", "-dev", "-dev-root-token-id=root"]
              ports:
              - containerPort: 8200
              env:
              - name: VAULT_DEV_ROOT_TOKEN_ID
                value: "{{ vault_root_token }}"
              - name: VAULT_DEV_LISTEN_ADDRESS
                value: "0.0.0.0:8200"
              - name: SKIP_SETCAP
                value: "true"
              securityContext:
                capabilities:
                  drop: [ALL]
                allowPrivilegeEscalation: false
  ignore_errors: yes

- name: Expose Vault as ClusterIP service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: vault
        namespace: vault
      spec:
        selector:
          app: vault
        ports:
        - port: 8200
          targetPort: 8200
        type: ClusterIP
  ignore_errors: yes

- name: Store API keys in Vault KV
  uri:
    url: "{{ vault_addr }}/v1/secret/data/chatbot"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      data:
        GROQ_API_KEY: "{{ groq_api_key }}"
        OPENAI_API_KEY: "{{ openai_api_key }}"
        MISTRAL_API_KEY: "{{ mistral_api_key }}"
        GROK_API_KEY: "{{ grok_api_key }}"
  delegate_to: localhost
  ignore_errors: yes

- name: Create llm-secrets K8s Secret from Vault values
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: llm-secrets
        namespace: "{{ namespace }}"
      type: Opaque
      stringData:
        GROQ_API_KEY: "{{ groq_api_key }}"
        OPENAI_API_KEY: "{{ openai_api_key }}"
        MISTRAL_API_KEY: "{{ mistral_api_key }}"
        GROK_API_KEY: "{{ grok_api_key }}"
  ignore_errors: yes
