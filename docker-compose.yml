services:

  # -- Elasticsearch -----------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # -- Logstash ----------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
      - "5045:5045"
    environment:
      - LS_JAVA_OPTS=-Xms128m -Xmx128m
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy

  # -- Filebeat (collects chatbot container logs) ------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - elk
    depends_on:
      - logstash
    command: filebeat -e -strict.perms=false

  # -- Redis -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - elk
    restart: unless-stopped

  # -- Vault (optional; start with --profile vault) ----------------------------
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    command: server -dev
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID:-}
      - VAULT_ADDR=http://0.0.0.0:8200
    profiles:
      - vault
    networks:
      - elk
    restart: unless-stopped

  # -- Chatbot RAG Backend -----------------------------------------------------
  chatbot-backend:
    build:
      context: ./backend
    image: poojannpandyaa/chatbot-backend:latest
    container_name: chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DEFAULT_MODEL=groq
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
    networks:
      - elk
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      vault:
        condition: service_started
        required: false
    restart: unless-stopped

  # -- Chatbot Frontend --------------------------------------------------------
  chatbot-frontend:
    build:
      context: ./app
    image: poojannpandyaa/chatbot-frontend:latest
    container_name: chatbot-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://chatbot-backend:8000
    networks:
      - elk
    depends_on:
      - chatbot-backend
    restart: unless-stopped

volumes:
  esdata:
    driver: local
  redis_data:
    driver: local

networks:
  elk:
    driver: bridge
