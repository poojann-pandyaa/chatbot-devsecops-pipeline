input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON logs produced by Next.js / Node.js
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Add a timestamp field if not present
  date {
    match => ["[parsed][timestamp]", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }

  # Enrich with container metadata
  mutate {
    add_field => {
      "app"         => "chatbot"
      "environment" => "local-k8s"
    }
  }

  # Drop noisy health-check logs
  if [message] =~ /GET \/api\/health/ {
    drop {}
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "chatbot-logs-%{+YYYY.MM.dd}"
    action   => "index"
  }

  # Useful during demo — prints processed logs to Logstash stdout
  stdout {
    codec => rubydebug
  }
}
