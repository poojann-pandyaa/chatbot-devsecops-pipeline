apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    # No rewrite-target: Grafana (GF_SERVER_SERVE_FROM_SUB_PATH=true) and
    # Prometheus (--web.route-prefix=/prometheus/) both handle their own
    # sub-paths natively. Nginx must forward the full path unchanged.
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: chatbot.local
    http:
      paths:
      # Grafana: http://chatbot.local/grafana/
      - path: /grafana(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
      # Prometheus: http://chatbot.local/prometheus/
      - path: /prometheus(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
