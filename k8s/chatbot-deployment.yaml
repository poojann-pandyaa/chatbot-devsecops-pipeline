apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-backend
  labels:
    app: chatbot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-backend
  template:
    metadata:
      labels:
        app: chatbot-backend
    spec:
      containers:
      - name: chatbot-backend
        image: chatbot-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: LOGSTASH_URL
          value: "http://logstash:5045"
        - name: DEFAULT_MODEL
          value: "grok"
        - name: GROK_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: GROK_API_KEY
        # Optional: uncomment to enable other providers
        # - name: OPENAI_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: llm-secrets
        #       key: OPENAI_API_KEY
        # - name: GROQ_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: llm-secrets
        #       key: GROQ_API_KEY
        # - name: MISTRAL_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: llm-secrets
        #       key: MISTRAL_API_KEY
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
spec:
  selector:
    app: chatbot-backend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
